[project]
name = "wmserp_picking"
authors = [{ name = "WMS ERP", email = "wms@example.com" }]
description = "Physical picking workflow (Ready to Pick -> Picking -> Picked) for ERPNext Pick Lists, used by the WMS ERP Android app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
erpnext = ">=14.0.0,<17.0.0"
