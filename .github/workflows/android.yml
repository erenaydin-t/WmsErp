name: Android CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_instrumented_tests:
        description: "Run Compose UI tests on an emulator"
        type: boolean
        default: false
      publish_release:
        description: "Publish this build as a GitHub Release (feeds the in-app updater) even though it is not main"
        type: boolean
        default: false
      publish_backend:
        description: "Publish erpnext/wmserp_picking to the wmserp_picking branch and tag its version even though it is not main"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  # Version of every build is <BASE_VERSION>.<workflow run number>; the run number is the versionCode.
  BASE_VERSION: "1.1"

jobs:
  build:
    name: Lint, unit tests & APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The secrets context cannot be used in step conditions, so expose a flag here.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (base version + workflow run number)
        id: version
        run: |
          version_name="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "WMSERP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "WMSERP_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "Building WMS ERP ${version_name} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore (only when secrets are configured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WMSERP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: ERPNext picking app rules tests (pure Python, no bench needed)
        run: python3 -m unittest discover -s erpnext/wmserp_picking -p "test_*.py" -v

      - name: Lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        env:
          WMSERP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WMSERP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WMSERP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wmserp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wmserp-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: wmserp-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

  release:
    name: Publish GitHub release (feeds the in-app updater)
    # Every build of main becomes a release "v<version>" with the release APK attached. The app reads
    # /repos/<owner>/<repo>/releases/latest, so main builds are offered as updates; a manual run with
    # "publish_release" does the same for the dispatched branch (testing before a merge).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the release APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: wmserp-release-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          apk="$(ls dist/*.apk | head -n 1)"
          asset="wmserp-${VERSION}.apk"
          cp "$apk" "$asset"
          notes="$(git log -1 --pretty=%B)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset#WMS ERP ${VERSION} (APK)" --clobber
          else
            gh release create "$tag" "$asset#WMS ERP ${VERSION} (APK)" --title "WMS ERP ${VERSION}" --notes "$notes" --latest
          fi
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"

  publish-backend:
    name: Publish ERPNext app branch (wmserp_picking)
    # bench needs a Frappe app at the root of what it clones, so the backend folder is published
    # as its own branch: `bench get-app https://github.com/<owner>/WmsErp --branch wmserp_picking`.
    # Runs on every push to main, or on a manual run with "publish_backend" for the dispatched branch.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_backend)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for the subtree split)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split erpnext/wmserp_picking and push it to the wmserp_picking branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          split=$(git subtree split --prefix=erpnext/wmserp_picking)
          echo "Split commit: $split"
          git push --force origin "$split:refs/heads/wmserp_picking"

      - name: Tag the published app version (wmserp_picking-v<__version__>)
        run: |
          set -euo pipefail
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', pathlib.Path('erpnext/wmserp_picking/wmserp_picking/__init__.py').read_text()).group(1))")
          tag="wmserp_picking-v${version}"
          split=$(git subtree split --prefix=erpnext/wmserp_picking)
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists; bump __version__ in wmserp_picking/__init__.py to publish a new one."
          else
            git tag -a "${tag}" "${split}" -m "wmserp_picking ${version}"
            git push origin "refs/tags/${tag}"
            echo "Tagged ${split} as ${tag}"
          fi

  instrumented-tests:
    name: Compose UI tests (emulator)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_instrumented_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
